name: Verify Website Page View Counters

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/verify-page-counters.yml'

permissions:
  contents: read

jobs:
  check-counters:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check four published pages and their real counters
        run: |
          python3 - <<'PY'
          import urllib.request
          import xml.etree.ElementTree as ET

          worker='https://adam-cloudstream-bundles.badass-insane.workers.dev/assets/site-views/'
          pages=[
            ('Portfolio','https://admknight.github.io/','portfolio'),
            ('MegaRepo dashboard','https://admknight.github.io/CloudstreamExtensions/','megarepo'),
            ('Extension Explorer','https://admknight.github.io/CloudstreamExtensions/explore.html','explorer'),
            ('Personal Repository Builder','https://adam-cloudstream-bundles.badass-insane.workers.dev/','builder')
          ]
          def fetch(url):
            req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 (CounterQA)','Accept':'text/html,image/svg+xml'})
            with urllib.request.urlopen(req,timeout=20) as response:
              body=response.read(350000)
              return response.status,response.headers,body

          for label,page,key in pages:
            status,headers,body=fetch(page)
            assert status==200, (label,status)
            html=body.decode('utf-8')
            target=worker+key+'.svg'
            assert target in html, f'{label} footer does not reference new counter'
            assert 'page-counter' in html, f'{label} page-view footer wrapper missing'
            status,headers,svg=fetch(target)
            assert status==200, (label,'badge',status)
            assert 'image/svg+xml' in headers.get('content-type',''), (label,headers.get('content-type'))
            assert headers.get('X-Page-Views-Status')=='ok', (label,'count unavailable')
            root=ET.fromstring(svg)
            title=root.find('{http://www.w3.org/2000/svg}title')
            assert title is not None and (title.text or '').startswith('Page views: '), label
            assert 'unavailable' not in (title.text or ''), label
            print(f'PASS: {label}: {title.text}; footer linked and counter loaded from own Worker domain')
          print('SUCCESS: All four published footer counters return visible count SVGs.')
          PY
